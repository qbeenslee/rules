# ==============================================================================
#  国产软件全量直连 · Clash / mihomo 规则集（macOS）
# ==============================================================================
#  形态 : 纯规则集（rule-provider，behavior: classical），**不含策略**
#         策略写在引用它的那条 rules 上：RULE-SET,china-apps-direct,DIRECT
#         换策略只改引用行，本文件零改动，可对外复用
#  内核 : 必须是 Meta / mihomo 系（ClashX Meta、Clash Verge Rev、Mihomo Party…）
#         原版 Clash Premium 不支持进程规则
#  要求 : find-process-mode 建议设为 always（见 README）；进程匹配需内核具备
#         读取进程信息的权限，macOS 上一般指 TUN 模式 + 提权
#  文档 : https://wiki.metacubex.one/config/rules/
#  日期 : 2026-11-07
# ==============================================================================
#
#  【语法速查】每条只有「类型,表达式」两段，第三段策略留给 RULE-SET 那行
#    PROCESS-NAME,WeChat                      精确进程名（区分大小写，需与可执行文件一致）
#    PROCESS-NAME-WILDCARD,*WeCom*            进程名通配，仅支持 * 和 ?（可跨字符）
#    PROCESS-NAME-REGEX,(?i)telegram          进程名正则（Go/RE2，默认区分大小写）
#    PROCESS-PATH,/usr/bin/curl               完整路径精确匹配
#    PROCESS-PATH-WILDCARD,/Applications/*/*  路径通配，仅支持 * 和 ?
#    PROCESS-PATH-REGEX,^/Applications/WeChat\.app/   路径正则（本文件主力）
#
#  【与 Loon 版的对应】Loon 的「目录前缀」规则在 Clash 没有等价类型，
#    统一改用 PROCESS-PATH-REGEX，锚定 ^/Applications/<App>.app/ 即可覆盖
#    Helper、Electron 子进程、小程序容器等全部可执行文件。
#
#  【一个坑】不要写 PROCESS-NAME,Electron
#    Electron 应用的进程名统一叫 Electron（VS Code、Obsidian 亦然），
#    按名称匹配会连带直连所有 Electron 应用，这类 App 一律用路径正则。
#
#  【顺序】Clash 的规则是严格自上而下匹配，没有 Loon 的「域名优先」例外，
#    所以本规则集只要排在广告拦截之后、所有代理类规则集之前即可，详见 README。

